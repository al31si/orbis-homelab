name: CI

# Verification only. This workflow never logs in to a registry, never pushes an image and never
# creates a release: publishing is a separate, manual workflow (release.yml, see docs/releasing.md).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses:check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      # Both architectures are built on this runner without emulation: the Dockerfile only runs
      # build steps on the build platform. The image is exported to a file and inspected: nothing
      # is pushed and no registry login happens. The arm64 image is built, not executed.
      - run: >
          docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION=0.0.0-ci --build-arg REVISION=${{ github.sha }}
          --output type=oci,dest=${{ runner.temp }}/image.tar .
      - run: node scripts/verify-oci.mjs "${{ runner.temp }}/image.tar" 0.0.0-ci

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/test-clean-install.sh
